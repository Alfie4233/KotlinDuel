name: ci

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: '0 7 * * *'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle' # Adjust to 'zulu' or 'temurin' once JDK 25 is fully stable
          
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        # Automatically caches Gradle dependencies to speed up builds
        cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
        
    - name: Cache SonarQube Cloud packages
      uses: actions/cache@v4
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
        
    - name: Build, Test, and Analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      shell: powershell
      # Runs the standard build (which includes testing) and the sonar analysis task
      run: .\gradlew.bat build sonar
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}